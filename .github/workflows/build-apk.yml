name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix

      - name: Verify JS bundle
        run: npx expo export --platform android --output-dir /tmp/expo-dist

      - name: Prebuild Android native project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.daemon=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luxe-locator-india-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
